spring.application.name=atividade_pratica

# String de conexão com banco de dados (cria um banco se não existir chamado "db_atividade_pratica")
spring.datasource.url=jdbc:mysql://localhost:3306/db_atividade_pratica?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# Credenciais (utilizando váriaveis de ambiente)
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect